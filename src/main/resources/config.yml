# ═══════════════════════════════════════════
#         AbexDelivery Configuration
# ═══════════════════════════════════════════
#
# Plugin connection credentials আর এখানে
# রাখতে হবে না। /abex setup command দিয়ে
# auto-connect হবে।
#
# ═══════════════════════════════════════════

settings:
  # কত সেকেন্ড পর পর Firebase চেক করবে
  # কম হলে = দ্রুত delivery, কিন্তু বেশি Firebase usage
  # বেশি হলে = ধীর delivery, কিন্তু কম Firebase usage
  poll-interval-seconds: 300

  # Setup code কতক্ষণ valid থাকবে (seconds)
  setup-timeout-seconds: 600

  # Debug mode (test করার জন্য)
  debug: false
